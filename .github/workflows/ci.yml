name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build demo, library and website
        run: |
          npm run build
          npm run build:lib
          node scripts/build-site.mjs
      - name: Bundle size budget
        run: npm run size
      - name: Snyk security scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN secret is not set; skipping Snyk scan in CI."
            exit 0
          fi
          npx --yes snyk@1.1308.4 test --org=6c00c6c3-d03f-4baf-8076-434221c1ddc4
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            npx --yes snyk@1.1308.4 monitor --org=6c00c6c3-d03f-4baf-8076-434221c1ddc4 --project-name=pixiform --target-reference=main
            npx --yes snyk@1.1308.4 code test --org=6c00c6c3-d03f-4baf-8076-434221c1ddc4 --report --project-name=pixiform --target-reference=main
          else
            npx --yes snyk@1.1308.4 code test --org=6c00c6c3-d03f-4baf-8076-434221c1ddc4
          fi
      - name: Install Playwright browsers (Chromium, WebKit, Firefox)
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Browser tests (Chromium, WebKit/Safari, Firefox)
        run: npm run test:e2e
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
