name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build demo, library and website
        run: |
          npm run build
          npm run build:lib
          node scripts/build-site.mjs
      - name: Bundle size budget
        run: npm run size
      - name: Install Playwright browsers (Chromium, WebKit, Firefox)
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Browser tests (Chromium, WebKit/Safari, Firefox)
        run: npm run test:e2e
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
