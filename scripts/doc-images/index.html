<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Doc images</title>
    <style>
      body { margin: 0; background: #fff; font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #374151; }
      #stage { display: inline-flex; flex-direction: column; gap: 20px; padding: 20px; background: #f6f7fb; }
      .row { display: flex; gap: 20px; align-items: flex-start; }
      .scene { margin: 0; display: flex; flex-direction: column; gap: 8px; }
      .canvas { position: relative; border: 1px solid #dde2ea; border-radius: 12px; overflow: hidden; background: var(--surface, #fff); }
      .canvas canvas { display: block; }
      figcaption { text-align: center; color: #5b6577; font-size: 12.5px; }
      .canvas.wide-notes { overflow: visible; margin-right: 220px; }
      .note { position: absolute; box-sizing: border-box; border: 1.5px dashed #6366f1; border-radius: 6px; pointer-events: none; }
      .note.a { border-color: #0ea5e9; }
      .note.b { border-color: #6366f1; }
      .note.c { border-color: #f59e0b; }
      .note.gap { border: 0; background: repeating-linear-gradient(45deg, rgba(236, 72, 153, 0.18) 0 4px, transparent 4px 8px); border-radius: 2px; }
      .note span { position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 12px; font-weight: 600; color: #4338ca; background: #eef2ff; padding: 2px 7px; border-radius: 6px; }
      .note.a span { color: #0369a1; background: #e0f2fe; }
      .note.c span { color: #b45309; background: #fef3c7; }
      .note.gap span { left: auto; right: calc(100% + 6px); color: #be185d; background: #fce7f3; }
      .canvas:not(.wide-notes) .note span { left: auto; right: 8px; top: 6px; transform: none; }
      .canvas:not(.wide-notes) .note.gap span { right: calc(100% + 6px); top: 50%; transform: translateY(-50%); }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./harness.js"></script>
  </body>
</html>
