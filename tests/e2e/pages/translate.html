<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Translation test</title>
  </head>
  <body>
    <div id="f"></div>
    <script type="module">
      // Test page for tests/e2e/translate.spec.ts: the endpoint is answered by the test.
      import { mountPixiForm } from '/src/lib/index.ts';
      import { translateConfig } from '/src/lib/translate.ts';
      const config = {
        title: 'Apply',
        submitText: 'Send',
        form: { botGuard: false },
        onSubmit: async () => ({ ok: true }),
        fields: [
          { type: 'text', name: 'name', label: 'Full name', required: true },
          { type: 'radio', name: 'plan', label: 'Plan', options: [{ value: 'free', label: 'Free' }, { value: 'pro', label: 'Pro' }] },
        ],
      };
      window.__handle = await mountPixiForm(document.getElementById('f'), await translateConfig(config, { url: '/__test/translate' }));
    </script>
  </body>
</html>
